<style>
:root{--font-main:'Inter',sans-serif;--font-heading:'Roboto Condensed',sans-serif}
[data-theme="light"]{--bg-main:#fff;--bg-secondary:#F7F7F7;--bg-tertiary:#e5e7eb;--text-main:#1c1c1e;--text-muted:#6B7280;--accent-blue:#1B3A6B;--accent-gold:#F5A623;--border-color:rgba(0,0,0,0.06);--shadow-soft:0 2px 12px rgba(0,0,0,0.04);--shadow-heavy:0 4px 24px rgba(27,58,107,0.1);--radius-sm:8px;--radius-md:16px;--glass-bg:#fff;--glass-bg-solid:#fff;--bg-card-warm:#fff}
[data-theme="dark"]{--bg-main:#fff;--bg-secondary:#F7F7F7;--bg-tertiary:#e5e7eb;--text-main:#1c1c1e;--text-muted:#6B7280;--accent-blue:#1B3A6B;--accent-gold:#F5A623;--border-color:rgba(0,0,0,0.06);--shadow-soft:0 2px 12px rgba(0,0,0,0.04);--shadow-heavy:0 4px 24px rgba(27,58,107,0.1);--glass-bg:#fff;--glass-bg-solid:#fff;--bg-card-warm:#fff}
body{font-family:var(--font-main)!important;background:var(--bg-main)!important;color:var(--text-main);opacity:1!important}
h1,h2,h3,h4{font-family:var(--font-heading)!important;font-weight:800!important;color:var(--accent-blue)}
.post-hero{max-width:800px;margin:0 auto;padding:140px 24px 20px}
.breadcrumb{font-size:13px;color:var(--text-muted);margin-bottom:16px}
.breadcrumb a{color:var(--text-muted);text-decoration:none}
.breadcrumb a:hover{color:var(--accent-blue)}
.breadcrumb span{color:var(--text-muted);margin:0 6px}
.post-hero-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:600;color:#fff;margin-bottom:12px}
.post-hero h1{font-size:clamp(28px,4vw,42px);color:var(--text-main);margin-bottom:16px;line-height:1.15}
.post-hero-meta{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--text-muted);flex-wrap:wrap;margin-bottom:24px}
.post-hero-meta .author-wrap{display:flex;align-items:center;gap:10px}
.post-hero-meta .author-wrap img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.post-hero-meta .author-wrap .author-role{display:block;font-size:11px;color:var(--text-muted);opacity:.65;margin-top:-1px}
.post-hero-meta .sep{color:var(--border-color)}
.post-cover{max-width:900px;margin:0 auto 40px;padding:0 24px}
.post-cover img{width:100%;border-radius:var(--radius-md);box-shadow:var(--shadow-soft);display:block}
.post-layout{max-width:1200px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:1fr 280px;gap:48px;position:relative}
.post-main{min-width:0}
.post-content{font-size:16px;line-height:1.8;color:var(--text-main)}
.post-content h2{font-size:26px;margin:48px 0 16px;color:var(--accent-blue);scroll-margin-top:80px}
.post-content h3{font-size:20px;margin:36px 0 12px;color:var(--accent-blue);scroll-margin-top:80px}
.post-content p{margin-bottom:20px}
.post-content img{max-width:100%;border-radius:var(--radius-sm);margin:24px 0;display:block}
.post-content figcaption{text-align:center;font-size:13px;font-style:italic;color:var(--text-muted);margin-top:-16px;margin-bottom:24px}
.post-content blockquote{border-left:4px solid var(--accent-gold);margin:24px 0;padding:16px 20px;background:var(--bg-secondary);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-style:normal;color:var(--text-main)}
.post-content blockquote p{margin-bottom:0}
.post-content ul,.post-content ol{padding-left:24px;margin-bottom:20px}
.post-content li{margin-bottom:8px}
.post-content a{color:var(--accent-blue);text-decoration:underline}
.post-content a:hover{color:var(--accent-gold)}
.post-content .cta-block{background:var(--bg-secondary);border-radius:var(--radius-md);padding:28px;text-align:center;margin:32px 0;border:1px solid var(--border-color)}
.post-content .cta-block h3{font-size:18px;margin-bottom:8px;color:var(--accent-blue)}
.post-content .cta-block p{font-size:14px;color:var(--text-muted);margin-bottom:16px}
.post-content .cta-block .btn{display:inline-block;padding:12px 28px;border-radius:var(--radius-sm);background:var(--accent-blue);color:#fff;text-decoration:none;font-weight:600;font-size:14px;font-family:var(--font-main);border:none;cursor:pointer;transition:background .2s}
.post-content .cta-block .btn:hover{background:var(--accent-gold)}
.post-content .cta-block .btn i{margin-right:8px}
.post-content .cta-download{background:var(--bg-secondary);border-radius:var(--radius-md);padding:24px;display:flex;align-items:center;gap:16px;margin:32px 0;border:1px solid var(--border-color)}
.post-content .cta-download i{font-size:32px;color:var(--accent-blue)}
.post-content .cta-download h4{font-size:15px;margin-bottom:4px;color:var(--text-main)}
.post-content .cta-download p{font-size:13px;color:var(--text-muted);margin-bottom:0;flex:1}
.post-content .cta-download .btn{flex-shrink:0}
.post-sidebar{position:sticky;top:100px;align-self:start;max-height:calc(100vh - 120px);overflow-y:auto}
.toc{background:var(--bg-secondary);border-radius:var(--radius-md);border:1px solid var(--border-color);padding:20px}
.toc h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:12px;font-family:var(--font-main)!important;font-weight:600!important}
.toc ul{list-style:none;padding:0;margin:0}
.toc li{margin-bottom:4px}
.toc a{display:block;padding:5px 10px;border-radius:var(--radius-sm);font-size:13px;color:var(--text-muted);text-decoration:none;transition:all .15s;border-left:2px solid transparent;line-height:1.4}
.toc a:hover{color:var(--accent-blue);background:rgba(27,58,107,0.04);border-left-color:var(--accent-blue)}
.toc a.active{color:var(--accent-blue);font-weight:600;background:rgba(27,58,107,0.06);border-left-color:var(--accent-blue)}
.toc .toc-h3{padding-left:24px;font-size:12px}
.toc-toggle{display:none;width:100%;padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-secondary);color:var(--text-main);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-main);text-align:left;margin-bottom:16px;transition:all .15s}

.toc-toggle.open i{transform:rotate(180deg)}
.resource-hero-cta{background:var(--bg-secondary);border-radius:var(--radius-md);padding:24px;display:flex;align-items:center;gap:16px;margin:24px 0 0;border:1px solid var(--border-color)}

.resource-hero-cta div{flex:1}
.resource-hero-cta h4{font-size:15px;margin-bottom:2px;color:var(--text-main)}
.resource-hero-cta p{font-size:13px;color:var(--text-muted);margin-bottom:0}
.resource-hero-cta .btn{flex-shrink:0}
.post-author-card{margin-bottom:40px;padding:24px;background:var(--bg-secondary);border-radius:var(--radius-md);border:1px solid var(--border-color);display:flex;gap:16px;align-items:center}
.post-author-card img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.post-author-card h4{font-size:16px;margin-bottom:2px}
.post-author-card p{font-size:13px;color:var(--text-muted);line-height:1.5;margin-bottom:0}
.post-author-card .social-links{display:flex;gap:8px;margin-top:6px}
.post-author-card .social-links a{color:var(--text-muted);font-size:16px;text-decoration:none}
.post-author-card .social-links a:hover{color:var(--accent-blue)}
.related-posts{margin:0 auto 40px;padding:0}
.related-posts h2{font-size:24px;margin-bottom:24px;color:var(--accent-blue)}
.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.related-card{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-color);background:var(--bg-main);box-shadow:var(--shadow-soft);cursor:pointer;transition:all .3s}
.related-card:hover{box-shadow:var(--shadow-heavy);transform:translateY(-3px)}
.related-card-image{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg-tertiary)}
.related-card-image img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.related-card:hover .related-card-image img{transform:scale(1.05)}
.related-card-body{padding:16px}
.related-card-body h3{font-size:15px;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.related-card-body h3 a{color:var(--text-main);text-decoration:none}
.related-card-body h3 a:hover{color:var(--accent-blue)}
.related-card-body p{font-size:12px;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-comments{margin:0 auto 60px;padding:0}
.post-comments h2{font-size:24px;margin-bottom:8px;color:var(--accent-blue)}
.post-comments .comments-count{font-size:14px;color:var(--text-muted);margin-bottom:24px}
.comment-form{background:var(--bg-secondary);border-radius:var(--radius-md);padding:24px;border:1px solid var(--border-color);margin-bottom:32px}
.comment-form h3{font-size:16px;margin-bottom:16px;color:var(--accent-blue)}
.comment-form .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.comment-form input,.comment-form textarea,.comment-form select{width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-main);color:var(--text-main);font-size:14px;font-family:var(--font-main);outline:none}
.comment-form input:focus,.comment-form textarea:focus,.comment-form select:focus{border-color:var(--accent-blue)}
.comment-form textarea{resize:vertical;min-height:80px}
.comment-form .rating-select{display:flex;gap:4px;margin-bottom:12px;font-size:20px;color:var(--border-color)}
.comment-form .rating-select i{cursor:pointer;transition:color .15s}
.comment-form .rating-select i.active,.comment-form .rating-select i:hover{color:var(--accent-gold)}
.comment-form .btn{padding:12px 24px;border-radius:var(--radius-sm);border:none;background:var(--accent-blue);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-main);transition:background .2s}
.comment-form .btn:hover{background:var(--accent-gold)}
.comment-form .btn:disabled{opacity:.5;cursor:default}
.comment-form .form-type-select{display:flex;gap:8px;margin-bottom:16px}
.comment-form .form-type-select button{padding:6px 16px;border-radius:20px;border:1px solid var(--border-color);background:var(--bg-main);color:var(--text-muted);font-size:13px;cursor:pointer;font-family:var(--font-main);transition:all .15s}
.comment-form .form-type-select button.active{border-color:var(--accent-blue);color:var(--accent-blue);background:rgba(27,58,107,0.06)}
.comment-form .rating-group{display:none;margin-bottom:12px}
.comment-form .rating-group.visible{display:block}
.comments-list .comment{padding:20px 0;border-bottom:1px solid var(--border-color)}
.comments-list .comment:last-child{border-bottom:none}
.comment-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.comment-avatar{width:36px;height:36px;border-radius:50%;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;flex-shrink:0}
.comment-author{font-weight:600;font-size:14px}
.comment-date{font-size:12px;color:var(--text-muted)}
.comment-rating{color:var(--accent-gold);font-size:14px;margin-left:auto}
.comment-text{font-size:14px;line-height:1.6;color:var(--text-main)}
.comment-admin-reply{margin-top:12px;margin-left:48px;padding:14px 18px;background:rgba(27,58,107,0.06);border-radius:var(--radius-sm);border-left:3px solid var(--accent-blue)}
.comment-admin-reply .reply-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;background:var(--accent-blue);color:#fff;margin-bottom:6px}
.comment-admin-reply p{font-size:13px;line-height:1.5;color:var(--text-main);margin-bottom:0}
.comment-success{display:none;text-align:center;padding:20px}
.comment-success i{font-size:40px;color:#10b981;margin-bottom:8px}
.comment-success p{font-size:14px;color:var(--text-muted)}
@media(max-width:1023px){
  .post-layout{grid-template-columns:1fr}
  .post-sidebar{position:static;max-height:none;margin-bottom:24px;order:-1}
  .toc-toggle{display:block}
  .toc{display:none}
  .toc.open{display:block}
}
@media(max-width:768px){
  .post-hero{padding-top:100px}
  .related-grid{grid-template-columns:1fr}
  .comment-form .form-row{grid-template-columns:1fr}
  .post-author-card{flex-direction:column;text-align:center}
  .resource-hero-cta{flex-direction:column;text-align:center}
}
</style>
</head><body>

<script>
const lang = localStorage.getItem('site_lang') || 'fr';
let currentSlug = '';
let post = null;
let badges = [];
let authors = [];
let currentRating = 0;
let commentType = 'comment';

function esc(str) { if (str == null) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function formatDate(d) {
  if (!d) return '';
  try {
    const date = new Date(d.endsWith('Z') ? d : d + 'Z');
    return date.toLocaleDateString(lang === 'fr' ? 'fr-FR' : 'en-US', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch(e) { return ''; }
}

function readingTime(content) {
  if (!content) return '1 min';
  const words = content.replace(/<[^>]*>/g, '').split(/\s+/).length;
  const min = Math.max(1, Math.ceil(words / 200));
  return min + ' min ' + (lang === 'fr' ? 'de lecture' : 'read');
}

async function fetchAPI(url) {
  try { const r = await fetch(url); if (!r.ok) { const body = await r.json().catch(()=>null); const rawErr = body?.error; let errMsg; if (typeof rawErr === 'object' && rawErr !== null) { errMsg = rawErr.message || rawErr.code || JSON.stringify(rawErr); } else { errMsg = rawErr || 'Erreur ' + r.status; } return { _error: errMsg }; } return await r.json(); } catch(e) { return { _error: e.message }; }
}

function selectCommentType(btn) {
  document.querySelectorAll('.form-type-select button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  commentType = btn.dataset.type;
  document.getElementById('ratingGroup').classList.toggle('visible', commentType === 'avis');
}

function setRating(n) {
  currentRating = n;
  document.querySelectorAll('#ratingSelect i').forEach((el, i) => {
    el.className = i < n ? 'fa-solid fa-star active' : 'fa-regular fa-star';
  });
}

function toggleToc() {
  const toc = document.getElementById('toc');
  const btn = document.getElementById('tocToggle');
  toc.classList.toggle('open');
  btn.classList.toggle('open');
}

function buildToc() {
  const container = document.getElementById('postContent');
  const headings = container.querySelectorAll('h2, h3');
  const list = document.getElementById('tocList');
  list.innerHTML = '';
  const sidebar = document.querySelector('.post-sidebar');
  if (headings.length < 2) { sidebar.style.display = 'none'; return; }
  sidebar.style.display = '';
  headings.forEach((h, i) => {
    if (!h.id) h.id = 'heading-' + i;
    const tag = h.tagName.toLowerCase();
    const text = h.textContent;
    list.innerHTML += '<li><a href="#' + h.id + '" class="' + (tag === 'h3' ? 'toc-h3' : '') + '" data-heading="' + i + '">' + esc(text) + '</a></li>';
  });
  const links = list.querySelectorAll('a');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        links.forEach(l => l.classList.remove('active'));
        const idx = parseInt(entry.target.dataset.headingIndex);
        const link = list.querySelector('[data-heading="' + idx + '"]');
        if (link) link.classList.add('active');
      }
    });
  }, { rootMargin: '-80px 0px -60% 0px' });
  headings.forEach((h, i) => {
    h.dataset.headingIndex = i;
    observer.observe(h);
  });
}

async function init() {
  currentSlug = window.location.pathname.replace('/blog/', '').replace(/\/$/, '');
  if (!currentSlug) {
    const params = new URLSearchParams(window.location.search);
    currentSlug = params.get('slug') || '';
  }
  if (!currentSlug) { document.getElementById('postContent').innerHTML = '<p style="text-align:center;padding:60px 0;color:var(--text-muted)">Article non trouvé.</p>'; return; }

  const [postData, badgesData, authorsData] = await Promise.all([
    fetchAPI('/api/blog/posts?slug=' + currentSlug),
    fetchAPI('/api/blog/badges'),
    fetchAPI('/api/blog/authors')
  ]);
  if (!postData || postData._error) { const errMsg = postData?._error; document.getElementById('postContent').innerHTML = '<p style="text-align:center;padding:60px 0;color:var(--text-muted)">' + (typeof errMsg === 'object' ? JSON.stringify(errMsg) : (errMsg || 'Article non trouvé.')) + '</p>'; document.getElementById('commentsSection').style.display = 'none'; return; }

  post = postData;
  badges = badgesData || [];
  authors = authorsData || [];
  renderPost();
  renderComments();
  renderRelated();
}

function renderPost() {
  document.title = post.metaTitle || post.title + ' — Prime Impact Agency';
  document.querySelector('meta[name="description"]').content = post.metaDescription || post.excerpt || '';

  const postBadges = (post.badgeIds || []).map(id => badges.find(b => b.id === id)).filter(Boolean);
  const isResource = postBadges.some(b => b.type === 'ressource');
  const author = authors.find(a => a.id === post.authorId);

  if (postBadges[0]) {
    const b = document.getElementById('heroBadge');
    b.style.display = 'inline-block';
    b.style.background = postBadges[0].color;
    b.textContent = postBadges[0].name;
  }

  document.getElementById('breadcrumbCat').textContent = postBadges[0]?.name || 'Article';

  document.getElementById('postTitle').textContent = post.title;

  const meta = document.getElementById('postMeta');
  let metaHTML = '';
  if (author) {
    metaHTML += '<div class="author-wrap"><img src="' + (author.avatar || '../assets/pia-logo-dark-sm.png') + '" alt="">';
    metaHTML += '<div><span>' + esc(author.name) + '</span>';
    if (author.role) metaHTML += '<span class="author-role">' + esc(author.role) + '</span>';
    metaHTML += '</div></div>';
  } else {
    metaHTML += '<div class="author-wrap"><i class="fa-solid fa-user" style="font-size:16px;opacity:.4"></i>';
    metaHTML += '<div><span>PIA</span></div></div>';
  }
  metaHTML += '<span class="sep">·</span>';
  metaHTML += '<span>' + formatDate(post.publishedAt || post.createdAt) + '</span>';
  metaHTML += '<span class="sep">·</span>';
  metaHTML += '<span>' + readingTime(post.content) + '</span>';
  if (post.viewCount > 0) {
    metaHTML += '<span class="sep">·</span>';
    metaHTML += '<span><i class="fa-regular fa-eye" style="margin-right:4px"></i>' + post.viewCount + '</span>';
  }
  meta.innerHTML = metaHTML;

  if (isResource && post.resourceFile) {
    const rc = document.getElementById('resourceCta');
    rc.style.display = 'flex';
    rc.innerHTML = '<i class="fa-solid fa-file-arrow-down"></i><div><h4>' + esc(post.title) + '</h4><p>' + (lang === 'fr' ? 'Téléchargez la ressource complète' : 'Download the full resource') + '</p></div><a class="btn" href="' + post.resourceFile + '" target="_blank" rel="noopener"><i class="fa-solid fa-download"></i> ' + (lang === 'fr' ? 'Télécharger' : 'Download') + '</a>';
  }

  if (post.coverImage) {
    const pc = document.getElementById('postCover');
    pc.style.display = 'block';
    document.getElementById('coverImage').src = post.coverImage;
  }

  document.getElementById('postContent').innerHTML = post.content || '';
  buildToc();

  if (author) {
    const ac = document.getElementById('authorCard');
    ac.style.display = 'flex';
    ac.innerHTML = '<img src="' + (author.avatar || '../assets/pia-logo-dark-sm.png') + '" alt="">' +
      '<div>' +
        '<h4>' + esc(author.name) + '</h4>' +
        '<p>' + esc(author.bio || '') + '</p>' +
        (author.socialLinks && (author.socialLinks.twitter || author.socialLinks.linkedin) ?
          '<div class="social-links">' +
            (author.socialLinks.twitter ? '<a href="' + author.socialLinks.twitter + '" target="_blank" rel="noopener"><i class="fa-brands fa-twitter"></i></a>' : '') +
            (author.socialLinks.linkedin ? '<a href="' + author.socialLinks.linkedin + '" target="_blank" rel="noopener"><i class="fa-brands fa-linkedin"></i></a>' : '') +
          '</div>' : '') +
      '</div>';
  }
}

async function renderRelated() {
  if (!post) return;
  const data = await fetchAPI('/api/blog/posts?status=published&lang=' + (post.lang || 'fr') + '&limit=10');
  const all = data?.posts || [];
  let related = all.filter(p => p.slug !== post.slug && p.badgeIds && post.badgeIds && p.badgeIds.some(id => post.badgeIds.includes(id)));
  if (related.length < 3) {
    related = all.filter(p => p.slug !== post.slug).slice(0, 3);
  }
  related = related.slice(0, 3);

  if (related.length === 0) return;
  document.getElementById('relatedSection').style.display = 'block';
  document.getElementById('relatedGrid').innerHTML = related.map(p => {
    const author = authors.find(a => a.id === p.authorId);
    return '<div class="related-card" onclick="window.location.href=\'/blog/' + p.slug + '\'">' +
      '<div class="related-card-image">' +
        '<img src="' + (p.coverImage || '../assets/pia-logo-dark-sm.png') + '" alt="" loading="lazy">' +
      '</div>' +
      '<div class="related-card-body">' +
        '<h3><a href="/blog/' + p.slug + '">' + esc(p.title) + '</a></h3>' +
        '<p>' + esc(p.excerpt) + '</p>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function renderComments() {
  if (!post) return;
  const data = await fetchAPI('/api/blog/comments?post=' + post.slug + '&status=published');
  const comments = data?.comments || [];
  document.getElementById('commentsCount').textContent = comments.length + ' ' + (lang === 'fr' ? 'avis / questions' : 'reviews / questions');

  const list = document.getElementById('commentsList');
  if (comments.length === 0) {
    list.innerHTML = '<p style="color:var(--text-muted);font-size:14px;padding:10px 0">' + (lang === 'fr' ? 'Soyez le premier à commenter !' : 'Be the first to comment!') + '</p>';
    return;
  }
  list.innerHTML = comments.map(c =>
    '<div class="comment">' +
      '<div class="comment-header">' +
        '<div class="comment-avatar"><i class="fa-solid fa-user"></i></div>' +
        '<span class="comment-author">' + esc(c.authorName) + '</span>' +
        '<span class="comment-date">' + formatDate(c.createdAt) + '</span>' +
        (c.rating > 0 ? '<span class="comment-rating">' + '★'.repeat(c.rating) + '☆'.repeat(5 - c.rating) + '</span>' : '') +
        (c.type === 'avis' ? '<span class="post-card-badge" style="background:var(--accent-gold);color:#fff;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;margin-left:auto">' + (lang === 'fr' ? 'Avis' : 'Review') + '</span>' : '') +
      '</div>' +
      '<div class="comment-text">' + esc(c.content) + '</div>' +
      (c.adminReply ? '<div class="comment-admin-reply"><span class="reply-badge"><i class="fa-solid fa-reply"></i> ' + (lang === 'fr' ? 'Réponse de l\'équipe' : 'Team response') + '</span><p>' + esc(c.adminReply.content) + '</p></div>' : '') +
    '</div>'
  ).join('');
}

async function submitComment() {
  const name = document.getElementById('commentName').value.trim();
  const email = document.getElementById('commentEmail').value.trim();
  const content = document.getElementById('commentContent').value.trim();
  if (!name || !content) return;
  if (!post) { alert(lang === 'fr' ? 'Article non chargé.' : 'Post not loaded.'); return; }

  const btn = document.getElementById('submitCommentBtn');
  btn.disabled = true; btn.textContent = lang === 'fr' ? 'Envoi...' : 'Sending...';

  try {
    const res = await fetch('/api/blog/comments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        postSlug: post.slug,
        type: commentType,
        authorName: name,
        authorEmail: email,
        content: content,
        rating: commentType === 'avis' ? currentRating : 0
      })
    });

    if (res.ok) {
      document.getElementById('commentForm').style.display = 'none';
      document.getElementById('commentSuccess').style.display = 'block';
    } else {
      const body = await res.json().catch(()=>null);
      alert(body?.error || (lang === 'fr' ? 'Erreur lors de l\'envoi.' : 'Error sending your message.'));
    }
  } catch(e) {
    alert(lang === 'fr' ? 'Erreur réseau.' : 'Network error.');
  }

  btn.disabled = false; btn.textContent = lang === 'fr' ? 'Envoyer' : 'Send';
}

document.addEventListener('DOMContentLoaded', init);
</script>
<script src="../config.js"></script>
<script src="../tracker.js"></script>
</body></html>
