<!DOCTYPE html><html lang="fr" data-theme="light"><head>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="apple-touch-icon" href="../assets/favicon.svg">
<meta name="theme-color" content="#1B3A6B">
<script>!function(){var l=localStorage.getItem('site_lang');if(l==='en')document.documentElement.lang='en'}()</script>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Prime Impact Agency</title>
<meta name="description" content="Actualités, conseils et stratégies webmarketing par Prime Impact Agency.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=13">
<link rel="stylesheet" href="../style-v2.css?v=3">
<style>
:root{--font-main:'Inter',sans-serif;--font-heading:'Roboto Condensed',sans-serif}
[data-theme="light"]{--bg-main:#fff;--bg-secondary:#F7F7F7;--bg-tertiary:#e5e7eb;--text-main:#1c1c1e;--text-muted:#6B7280;--accent-blue:#1B3A6B;--accent-gold:#F5A623;--border-color:rgba(0,0,0,0.06);--shadow-soft:0 2px 12px rgba(0,0,0,0.04);--shadow-heavy:0 4px 24px rgba(27,58,107,0.1);--radius-sm:8px;--radius-md:16px;--glass-bg:#fff;--glass-bg-solid:#fff;--bg-card-warm:#fff}
[data-theme="dark"]{--bg-main:#fff;--bg-secondary:#F7F7F7;--bg-tertiary:#e5e7eb;--text-main:#1c1c1e;--text-muted:#6B7280;--accent-blue:#1B3A6B;--accent-gold:#F5A623;--border-color:rgba(0,0,0,0.06);--shadow-soft:0 2px 12px rgba(0,0,0,0.04);--shadow-heavy:0 4px 24px rgba(27,58,107,0.1);--glass-bg:#fff;--glass-bg-solid:#fff;--bg-card-warm:#fff}
body{font-family:var(--font-main)!important;background:var(--bg-main)!important;color:var(--text-main);opacity:1!important}
h1,h2,h3,h4{font-family:var(--font-heading)!important;font-weight:800!important}

/* ─── HERO ─────────────────────────────────── */
.blog-header{padding:140px 0 50px;text-align:center;position:relative;overflow:hidden;background:linear-gradient(180deg,var(--bg-main)0%,rgba(27,58,107,0.02)100%)}
.blog-header::before{content:'';position:absolute;top:-40%;right:-10%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(27,58,107,0.04)0%,transparent 70%);pointer-events:none}
.blog-header .container{position:relative;z-index:1}
.blog-header h1{font-size:clamp(34px,5vw,56px);color:var(--accent-blue);margin-bottom:8px}
.blog-header p{color:var(--text-muted);font-size:16px;max-width:520px;margin:0 auto}

/* ─── NEWSLETTER BANDEAU PLEINE LARGEUR ──── */
.newsletter-strip{background:#0D1B35;padding:40px 24px;margin-bottom:40px}
.newsletter-strip .container{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px}
.newsletter-strip .ns-left{flex:1}
.newsletter-strip h2{font-size:22px;color:#fff;margin-bottom:6px;font-weight:700}
.newsletter-strip p{color:rgba(255,255,255,0.65);font-size:14px;margin:0}
.newsletter-strip .ns-form{display:flex;gap:8px;flex-shrink:0;min-width:360px}
.newsletter-strip .ns-form input{flex:1;padding:12px 16px;border-radius:var(--radius-sm);border:none;background:rgba(255,255,255,0.1);color:#fff;font-size:14px;font-family:var(--font-main);outline:none;transition:background .2s;min-width:0}
.newsletter-strip .ns-form input::placeholder{color:rgba(255,255,255,0.4)}
.newsletter-strip .ns-form input:focus{background:rgba(255,255,255,0.18)}
.newsletter-strip .ns-form button{padding:12px 24px;border-radius:var(--radius-sm);border:none;background:var(--accent-gold);color:#0D1B35;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-main);transition:opacity .2s;white-space:nowrap}
.newsletter-strip .ns-form button:hover{opacity:.85}
.newsletter-strip .ns-form button:disabled{opacity:.5;cursor:default}
.newsletter-strip .ns-msg{font-size:13px;margin-top:8px}
.newsletter-strip .ns-msg.success{color:#4ade80}
.newsletter-strip .ns-msg.error{color:#f87171}

/* ─── LAYOUT : SIDEBAR GAUCHE + CONTENU DROITE ─ */
.blog-container{max-width:1200px;margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:280px 1fr;gap:40px}
.blog-sidebar{display:flex;flex-direction:column;gap:20px}
.sidebar-card{background:var(--bg-main);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:20px;box-shadow:var(--shadow-soft)}
.sidebar-card h3{font-size:14px;color:var(--text-main);margin-bottom:14px;font-weight:700;font-family:var(--font-heading)}

/* search */
.sidebar-search{position:relative}
.sidebar-search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px;pointer-events:none}
.sidebar-search input{width:100%;padding:10px 12px 10px 36px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-secondary);color:var(--text-main);font-size:13px;font-family:var(--font-main);outline:none;transition:border-color .2s}
.sidebar-search input:focus{border-color:var(--accent-blue)}
.sidebar-search input::placeholder{color:var(--text-muted)}

/* toggle grid/list */
.view-toggle{display:flex;gap:0;border:1px solid var(--border-color);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:14px}
.view-toggle button{flex:1;padding:8px 0;border:none;background:transparent;color:var(--text-muted);font-size:13px;cursor:pointer;font-family:var(--font-main);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px}
.view-toggle button i{font-size:13px}
.view-toggle button:hover{color:var(--accent-blue)}
.view-toggle button.active{background:var(--accent-blue);color:#fff}

/* categories */
.category-list{display:flex;flex-direction:column;gap:2px}
.category-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;border:none;background:transparent;width:100%;text-align:left;font-family:var(--font-main);font-size:13px;color:var(--text-muted)}
.category-item:hover{background:var(--bg-secondary);color:var(--text-main)}
.category-item.active{background:rgba(27,58,107,0.06);color:var(--accent-blue);font-weight:600}
.category-item .cat-name{flex:1}
.category-item .cat-count{font-size:11px;color:var(--text-muted);background:var(--bg-secondary);padding:1px 8px;border-radius:20px;flex-shrink:0}
.category-item.active .cat-count{background:rgba(27,58,107,0.12);color:var(--accent-blue)}
.category-item .cat-icon{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:none}
.category-item.active .cat-icon{display:block}
.category-item.is-resource{position:relative}
.category-item.is-resource .cat-name::after{content:'\f019';font-family:'Font Awesome 6 Free';font-weight:900;font-size:10px;margin-left:6px}
.category-item.is-resource.active{background:rgba(245,166,35,0.08)}
.category-item.is-resource.active .cat-count{background:rgba(245,166,35,0.15);color:var(--accent-gold)}

/* ─── FEATURED ARTICLE ────────────────────── */
.blog-main{min-width:0}
.featured-card{display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-color);background:var(--bg-main);box-shadow:var(--shadow-soft);margin-bottom:32px;transition:box-shadow .3s}
.featured-card:hover{box-shadow:var(--shadow-heavy)}
.featured-image{position:relative;aspect-ratio:16/10;overflow:hidden}
.featured-image img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.featured-card:hover .featured-image img{transform:scale(1.03)}
.featured-badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.featured-badge{padding:4px 14px;border-radius:20px;font-size:11px;font-weight:600;color:#fff;pointer-events:none}
.featured-badge.is-resource{background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.6);display:inline-flex;align-items:center;gap:4px}
.featured-badge.is-resource i{font-size:10px}
.featured-content{padding:30px;display:flex;flex-direction:column;justify-content:center}
.featured-content h2{font-size:24px;margin-bottom:10px;color:var(--text-main)}
.featured-content h2 a{color:inherit;text-decoration:none}
.featured-content h2 a:hover{color:var(--accent-blue)}
.featured-content p{font-size:14px;line-height:1.6;color:var(--text-muted);margin-bottom:16px}
.featured-meta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text-muted);flex-wrap:wrap}
.featured-meta img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.featured-meta .sep{color:var(--border-color)}
.featured-meta .meta-likes{display:flex;align-items:center;gap:4px;color:var(--text-muted);font-size:12px;cursor:pointer;transition:color .2s}
.featured-meta .meta-likes:hover{color:var(--accent-blue)}
.featured-meta .meta-likes.is-liked{color:var(--accent-blue);font-weight:600}
.featured-meta .meta-likes.is-liked i{font-weight:900}

/* ─── POSTS GRID / LIST ───────────────────── */
.posts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-bottom:32px}
.posts-grid.is-list{grid-template-columns:1fr}
.post-card{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-color);background:var(--bg-main);box-shadow:var(--shadow-soft);transition:all .3s;cursor:pointer;display:flex;flex-direction:column}
.post-card:hover{box-shadow:var(--shadow-heavy);transform:translateY(-3px)}
.posts-grid.is-list .post-card{flex-direction:row}
.post-card-image{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg-tertiary);flex-shrink:0}
.post-card-image img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.post-card:hover .post-card-image img{transform:scale(1.05)}
.posts-grid.is-list .post-card-image{width:280px;aspect-ratio:16/11;flex-shrink:0}
.post-card-badges{position:absolute;top:10px;left:10px;display:flex;gap:4px;flex-wrap:wrap;z-index:2}
.post-card-badge{padding:3px 12px;border-radius:20px;font-size:10px;font-weight:600;color:#fff;pointer-events:none}
.post-card-badge.is-resource{background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.6);display:inline-flex;align-items:center;gap:3px}
.post-card-badge.is-resource i{font-size:9px}
.post-card-body{padding:18px;flex:1;display:flex;flex-direction:column}
.posts-grid.is-list .post-card-body{padding:16px 20px}
.post-card-body h3{font-size:16px;margin-bottom:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-card-body h3 a{color:var(--text-main);text-decoration:none}
.post-card-body h3 a:hover{color:var(--accent-blue)}
.post-card-body p{font-size:13px;color:var(--text-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px;flex:1}
.posts-grid.is-list .post-card-body p{-webkit-line-clamp:2}
.post-card-read-more{font-size:12px;font-weight:600;color:var(--accent-blue);text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:gap .2s;margin-top:auto}
.post-card-read-more i{font-size:10px;transition:transform .2s}
.post-card:hover .post-card-read-more i{transform:translateX(3px)}
.post-card-footer{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);border-top:1px solid var(--border-color);padding:12px 18px;flex-shrink:0;min-height:44px}
.posts-grid.is-list .post-card-footer{padding:10px 18px}
.post-card-footer .footer-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0}
.post-card-footer .footer-author{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-card-footer .card-footer-right{margin-left:auto;display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
.post-card-likes{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text-muted);cursor:pointer;transition:color .2s}
.post-card-likes:hover{color:var(--accent-blue)}
.post-card-likes.is-liked{color:var(--accent-blue);font-weight:600}
.post-card-likes.is-liked i{font-weight:900}

/* ─── PAGINATION ──────────────────────────── */
.pagination{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.pagination button{padding:10px 18px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-main);color:var(--text-muted);font-size:14px;cursor:pointer;font-family:var(--font-main);transition:all .15s}
.pagination button:hover{border-color:var(--accent-blue);color:var(--accent-blue)}
.pagination button.active{background:var(--accent-blue);color:#fff;border-color:var(--accent-blue)}
.pagination button:disabled{opacity:.3;cursor:default}
.pagination .page-prev-next{background:transparent;border-color:transparent;font-size:13px;color:var(--text-muted)}
.pagination .page-prev-next:hover{color:var(--accent-blue)}

/* ─── EMPTY ──────────────────────────────── */
.empty-blog{text-align:center;padding:80px 20px;color:var(--text-muted)}
.empty-blog i{font-size:48px;margin-bottom:12px;opacity:.4}
.empty-blog h3{font-size:20px;color:var(--text-main);margin-bottom:6px}

/* ─── RESPONSIVE ──────────────────────────── */
@media(max-width:1100px){
  .blog-container{grid-template-columns:1fr}
  .blog-sidebar{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .posts-grid{grid-template-columns:repeat(2,1fr)}
  .newsletter-strip .container{flex-direction:column;text-align:center}
  .newsletter-strip .ns-form{min-width:0;width:100%;max-width:440px}
}
@media(max-width:768px){
  .blog-header{padding:100px 0 30px}
  .blog-header h1{font-size:clamp(28px,8vw,34px)}
  .featured-card{grid-template-columns:1fr}
  .featured-image{aspect-ratio:16/9}
  .featured-content{padding:20px}
  .featured-content h2{font-size:20px}
  .post-card-body{padding:14px}
  .post-card-footer{padding:10px 14px;font-size:11px}
  .posts-grid{grid-template-columns:1fr;gap:16px}
  .posts-grid.is-list .post-card{flex-direction:column}
  .posts-grid.is-list .post-card-image{width:100%}
  .blog-sidebar{grid-template-columns:1fr;gap:16px}
  .blog-container{padding:0 16px 40px}
  .pagination{gap:4px}
  .pagination button{padding:8px 12px;font-size:12px;min-width:36px}
  .pagination .page-prev-next{padding:8px 10px}
  .newsletter-strip{padding:28px 16px}
  .newsletter-strip h2{font-size:18px}
  .newsletter-strip .ns-form{flex-direction:column;gap:6px}
  .sidebar-card{padding:16px}
}
@media(max-width:480px){
  .blog-header{padding:90px 0 24px}
  .blog-header h1{font-size:26px}
  .blog-header p{font-size:14px}
  .featured-content{padding:16px}
  .featured-content h2{font-size:18px}
  .featured-content p{font-size:13px}
}
</style>
</head><body>
<div id="app">
<section class="blog-header">
  <div class="container">
    <h1 data-i18n="blog.archive.title">Blog</h1>
    <p data-i18n="blog.archive.sub">Actualités, conseils et stratégies pour votre croissance digitale.</p>
  </div>
</section>

<!-- Article à la une -->
<div style="max-width:1200px;margin:0 auto;padding:0 24px">
  <div class="featured-card" id="featuredCard" style="display:none"></div>
</div>

<!-- Bandeau newsletter pleine largeur -->
<div class="newsletter-strip" id="newsletterStrip">
  <div class="container">
    <div class="ns-left">
      <h2 data-i18n="blog.sidebar.cta.title">Restez informé</h2>
      <p data-i18n="blog.sidebar.cta.desc">Recevez nos derniers articles et conseils directement par email.</p>
    </div>
    <div class="ns-form">
      <input type="email" id="nsEmail" placeholder="Votre email" data-i18n-ph="blog.sidebar.cta.placeholder">
      <button id="nsBtn" onclick="subscribeNewsletter()" data-i18n="blog.sidebar.cta.btn">S'abonner</button>
    </div>
    <div class="ns-msg" id="nsMsg"></div>
  </div>
</div>

<!-- Sidebar gauche + Grille droite -->
<div class="blog-container">
  <aside class="blog-sidebar">
    <div class="sidebar-card" id="srchCard">
      <div class="sidebar-search">
        <i class="fa-solid fa-search"></i>
        <input type="text" id="searchInput" placeholder="Rechercher..." data-i18n-ph="blog.archive.search">
      </div>
    </div>
    <div class="sidebar-card" id="viewCard">
      <h3 data-i18n="blog.archive.view">Affichage</h3>
      <div class="view-toggle" id="viewToggle">
        <button class="active" data-view="grid" onclick="switchView('grid')"><i class="fa-solid fa-grid-2"></i> Grille</button>
        <button data-view="list" onclick="switchView('list')"><i class="fa-solid fa-list"></i> Liste</button>
      </div>
    </div>
    <div class="sidebar-card" id="catCard">
      <h3 data-i18n="blog.archive.categories">Catégories</h3>
      <div class="category-list" id="categoryList">
        <button class="category-item active" data-badge="" onclick="filterBadge(this)">
          <span class="cat-name" data-i18n="blog.archive.all">Tous</span>
          <span class="cat-count" id="totalCount">0</span>
        </button>
      </div>
    </div>
  </aside>
  <div class="blog-main" id="blogMain">
    <div class="empty-blog" id="emptyState" style="display:none">
      <i class="fa-solid fa-newspaper"></i>
      <h3 data-i18n="blog.archive.empty">Aucun article trouvé</h3>
      <p data-i18n="blog.archive.empty.sub">Revenez bientôt ou explorez d'autres catégories.</p>
    </div>
    <div class="posts-grid" id="postsGrid"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>
</div>

<script src="../i18n.js"></script>
<script src="../components.js"></script>
<script src="../main.js"></script>
<script>
const lang = localStorage.getItem('site_lang') || 'fr';
let currentPage = 1;
let currentBadge = '';
let currentSearch = '';
let currentLang = lang;
let allPosts = [];
let badges = [];
let authors = [];
let filteredPosts = [];
let pageSize = 9;
let viewMode = 'grid';

function esc(str) { if (str == null) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function formatDate(d) {
  if (!d) return '';
  try {
    const date = new Date(d.endsWith('Z') ? d : d + 'Z');
    if (isNaN(date.getTime())) return '';
    return date.toLocaleDateString(lang === 'fr' ? 'fr-FR' : 'en-US', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch(e) { return ''; }
}

function readingTime(content) {
  if (!content) return '1 min';
  const words = content.replace(/<[^>]*>/g, '').split(/\s+/).length;
  const min = Math.max(1, Math.ceil(words / 200));
  return min + ' min ' + (lang === 'fr' ? 'de lecture' : 'read');
}

async function fetchAPI(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.json();
  } catch(e) { return null; }
}

async function init() {
  console.log('[BLOG] init start');
  const [postsData, badgesData, authorsData] = await Promise.all([
    fetchAPI('/api/blog/posts?status=published&lang=' + currentLang + '&limit=200'),
    fetchAPI('/api/blog/badges'),
    fetchAPI('/api/blog/authors')
  ]);
  allPosts = postsData?.posts || [];
  badges = badgesData || [];
  authors = authorsData || [];
  filteredPosts = [...allPosts];
  console.log('[BLOG] posts:', allPosts.length, 'badges:', badges.length);

  renderSidebarCategories();
  renderPosts();
  renderPopular();

  document.getElementById('searchInput').addEventListener('input', function() {
    currentSearch = this.value.toLowerCase();
    currentPage = 1;
    filterAndRender();
  });
}

function renderSidebarCategories() {
  const container = document.getElementById('categoryList');
  const allCount = allPosts.length;
  document.getElementById('totalCount').textContent = allCount;

  badges.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'category-item' + (b.type === 'resource' ? ' is-resource' : '');
    btn.dataset.badge = b.id;
    btn.innerHTML = '<span class="cat-name">' + esc(b.name) + '</span><span class="cat-count">' + (b.postCount || 0) + '</span>';
    btn.onclick = function() { filterBadge(this); };
    container.appendChild(btn);
  });
}

function filterBadge(btn) {
  document.querySelectorAll('.category-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentBadge = btn.dataset.badge;
  currentPage = 1;
  filterAndRender();
}

function switchView(mode) {
  viewMode = mode;
  document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('active', b.dataset.view === mode));
  renderPosts();
}

function filterAndRender() {
  let posts = [...allPosts];
  if (currentBadge) posts = posts.filter(p => p.badgeIds && p.badgeIds.includes(currentBadge));
  if (currentSearch) {
    const q = currentSearch;
    posts = posts.filter(p =>
      (p.title || '').toLowerCase().includes(q) ||
      (p.excerpt || '').toLowerCase().includes(q)
    );
  }
  filteredPosts = posts;
  renderPosts();
  renderPagination();
}

function renderPosts() {
  const grid = document.getElementById('postsGrid');
  const featured = document.getElementById('featuredCard');
  const empty = document.getElementById('emptyState');
  const sidebar = document.querySelector('.blog-sidebar');

  grid.className = 'posts-grid' + (viewMode === 'list' ? ' is-list' : '');

  if (filteredPosts.length === 0) {
    featured.style.display = 'none';
    sidebar.style.display = 'flex';
    grid.innerHTML = '';
    empty.style.display = 'block';
    renderPagination();
    return;
  }
  empty.style.display = 'none';
  sidebar.style.display = 'flex';

  const totalPages = Math.ceil(filteredPosts.length / pageSize);
  if (currentPage > totalPages) currentPage = totalPages;

  let displayPosts;

  if (currentPage === 1 && viewMode === 'grid') {
    const featuredPost = filteredPosts[0];
    const featuredBadges = (featuredPost.badgeIds || []).map(id => badges.find(b => b.id === id)).filter(Boolean);
    featured.style.display = 'grid';
    featured.innerHTML = `
      <a href="/blog/${featuredPost.slug}" class="featured-image">
        <div class="featured-badges">${featuredBadges.map(b => {
          const cls = b.type === 'resource' ? ' featured-badge is-resource' : ' featured-badge';
          const icon = b.type === 'resource' ? ' <i class="fa-solid fa-download"></i>' : '';
          return '<span class="' + cls.trim() + '" style="background:' + b.color + '">' + esc(b.name) + icon + '</span>';
        }).join('')}</div>
        <img src="${featuredPost.coverImage || '../assets/pia-logo-dark-sm.png'}" alt="${esc(featuredPost.title)}" loading="lazy">
      </a>
      <div class="featured-content">
        <h2><a href="/blog/${featuredPost.slug}">${esc(featuredPost.title)}</a></h2>
        <p>${esc(featuredPost.excerpt)}</p>
        <div class="featured-meta">
          ${(() => { const a = authors.find(aa => aa.id === featuredPost.authorId); return a && a.avatar ? '<img src="' + a.avatar + '" alt="">' : ''; })()}
          <span>${authors.find(a => a.id === featuredPost.authorId)?.name || 'PIA'}</span>
          <span class="sep">·</span>
          <span>${formatDate(featuredPost.publishedAt)}</span>
          <span class="sep">·</span>
          <span>${readingTime(featuredPost.content)}</span>
          <span class="sep">·</span>
          <span class="meta-likes${featuredPost.isLiked ? ' is-liked' : ''}" onclick="toggleLike(this, '${featuredPost.slug}')">
            <i class="${featuredPost.isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i> ${featuredPost.likesCount || 0}
          </span>
        </div>
      </div>
    `;
    displayPosts = filteredPosts.slice(1, pageSize);
  } else {
    featured.style.display = 'none';
    const start = (currentPage - 1) * pageSize;
    displayPosts = filteredPosts.slice(start, start + pageSize);
  }

  if (displayPosts.length === 0) { grid.innerHTML = ''; renderPagination(); return; }

  grid.innerHTML = displayPosts.map(post => {
    const postBadges = (post.badgeIds || []).map(id => badges.find(b => b.id === id)).filter(Boolean);
    const author = authors.find(a => a.id === post.authorId);
    return '<div class="post-card" onclick="window.location.href=\'/blog/' + post.slug + '\'">' +
      '<div class="post-card-image">' +
        '<img src="' + (post.coverImage || '../assets/pia-logo-dark-sm.png') + '" alt="' + esc(post.title) + '" loading="lazy">' +
        '<div class="post-card-badges">' + postBadges.map(b => {
          const cls = b.type === 'resource' ? 'is-resource' : '';
          const icon = b.type === 'resource' ? ' <i class="fa-solid fa-download"></i>' : '';
          return '<span class="post-card-badge' + (cls ? ' ' + cls : '') + '" style="background:' + b.color + '">' + esc(b.name) + icon + '</span>';
        }).join('') + '</div>' +
      '</div>' +
      '<div class="post-card-body">' +
        '<h3><a href="/blog/' + post.slug + '">' + esc(post.title) + '</a></h3>' +
        '<p>' + esc(post.excerpt) + '</p>' +
        '<a href="/blog/' + post.slug + '" class="post-card-read-more">' + (lang === 'fr' ? 'Lire plus' : 'Read more') + ' <i class="fa-solid fa-arrow-right"></i></a>' +
      '</div>' +
      '<div class="post-card-footer">' +
        '<span class="footer-avatar">' + (author && author.avatar ? '<img src="' + author.avatar + '" alt="" style="width:24px;...">' : '') + '</span>' +
        '<span class="footer-author">' + (author?.name || 'PIA') + '</span>' +
        '<span class="card-footer-right">' +
          '<span class="post-card-likes' + (post.isLiked ? ' is-liked' : '') + '" onclick="event.stopPropagation();toggleLike(this,\'' + post.slug + '\')">' +
            '<i class="' + (post.isLiked ? 'fa-solid' : 'fa-regular') + ' fa-heart"></i> ' + (post.likesCount || 0) +
          '</span>' +
        '</span>' +
      '</div>' +
    '</div>';
  }).join('');

  renderPagination();
}

function renderPagination() {
  const pag = document.getElementById('pagination');
  const totalPages = Math.ceil(filteredPosts.length / pageSize);
  if (totalPages <= 1) { pag.innerHTML = ''; return; }

  let html = '';
  html += '<button class="page-prev-next" onclick="goPage(' + (currentPage - 1) + ')"' + (currentPage <= 1 ? ' disabled' : '') + '><i class="fa-solid fa-chevron-left"></i></button>';
  for (let i = 1; i <= totalPages; i++) {
    html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
  }
  html += '<button class="page-prev-next" onclick="goPage(' + (currentPage + 1) + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '><i class="fa-solid fa-chevron-right"></i></button>';
  pag.innerHTML = html;
}

function goPage(page) {
  if (page < 1 || page > Math.ceil(filteredPosts.length / pageSize)) return;
  currentPage = page;
  renderPosts();
  window.scrollTo({ top: document.getElementById('blogMain').offsetTop - 120, behavior: 'smooth' });
}

async function toggleLike(el, slug) {
  const numEl = el.querySelector('.like-num') || el;
  let current = parseInt(numEl.dataset.likes || el.dataset.likes || (numEl.textContent.trim().match(/\d+/)?.[0]) || 0);
  const liked = el.classList.toggle('is-liked');
  const i = el.querySelector('i');
  i.className = liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
  current = liked ? current + 1 : Math.max(0, current - 1);
  el.dataset.likes = current;
  const match = numEl.textContent.trim().match(/\d+/);
  numEl.textContent = numEl.textContent.replace(/\d+/, current);
  try {
    await fetch('/api/blog/posts?slug=' + slug, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ likesCount: current })
    });
  } catch(e) {}
}

async function renderPopular() {}

async function subscribeNewsletter() {
  const input = document.getElementById('nsEmail');
  const btn = document.getElementById('nsBtn');
  const msg = document.getElementById('nsMsg');
  const email = input.value.trim();
  if (!email || !email.includes('@')) {
    msg.className = 'ns-msg error';
    msg.textContent = lang === 'fr' ? 'Email invalide.' : 'Invalid email.';
    return;
  }
  btn.disabled = true;
  btn.textContent = lang === 'fr' ? 'Envoi...' : 'Sending...';
  msg.textContent = '';
  try {
    const res = await fetch('/api/blog/newsletters', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, source: 'blog-archive' })
    });
    const data = await res.json();
    if (res.ok) {
      msg.className = 'ns-msg success';
      msg.textContent = lang === 'fr' ? 'Merci ! Vous êtes inscrit.' : 'Thanks! You are subscribed.';
      input.value = '';
    } else {
      msg.className = 'ns-msg error';
      msg.textContent = data?.error || (lang === 'fr' ? 'Erreur.' : 'Error.');
    }
  } catch(e) {
    msg.className = 'ns-msg error';
    msg.textContent = lang === 'fr' ? 'Erreur réseau.' : 'Network error.';
  }
  btn.disabled = false;
  btn.textContent = lang === 'fr' ? 'S\'abonner' : 'Subscribe';
}
